<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MF Higienização - DF</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#0056b3;--dark:#003b7a;--green:#25d366;--accent:#f39c12;--light:#f4f7f6;--gray:#666}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--light);color:#333;padding-bottom:90px}
header{background:linear-gradient(135deg,var(--dark),var(--primary));color:#fff;text-align:center;padding:40px 20px;border-radius:0 0 20px 20px}
.badge{background:rgba(255,255,255,.2);padding:5px 15px;border-radius:20px;font-size:.8rem}
.container{max-width:800px;margin:0 auto;padding:20px}
.card{background:#fff;padding:25px;border-radius:12px;margin-bottom:25px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.card h2{color:var(--primary);text-align:center;margin-bottom:15px}
.service-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.service-card{background:#eef5fc;padding:15px;border-radius:10px;border-left:4px solid var(--primary);text-align:center}
.price{color:#1eb956;font-weight:bold}
.form-group{margin-bottom:15px} label{font-weight:bold;font-size:.9rem;display:block;margin-bottom:5px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}
#preview{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:10px;display:none;border:2px solid #ddd}
#base64Output{width:100%;height:90px;font-size:.65rem;margin-top:10px;display:none;padding:8px}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;display:flex;justify-content:center;gap:8px;align-items:center}
.btn-green{background:var(--green);color:#fff}.btn-blue{background:#eef5fc;color:var(--primary);border:1px solid var(--primary);margin-top:8px;display:none}
.btn:disabled{background:#999}
.notice{background:#e8f5e9;border:1px solid #c8e6c9;padding:10px;border-radius:8px;font-size:.85rem;color:#2e7d32;margin-bottom:15px;display:flex;gap:8px}
option:disabled{color:#aaa!important;background:#eee!important}
.whatsapp{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:12px 20px;border-radius:50px;text-decoration:none;font-weight:bold;box-shadow:0 4px 15px rgba(0,0,0,.2)}
</style>
</head>
<body>
<header>
<span class="badge">📍 Todo o DF - Atendimento em Casa</span>
<h1>MF Higienização</h1>
<p>Elimine 99,9% de ácaros e sujeira profunda</p>
</header>

<div class="container">
<div class="card">
<h2>Serviços & Preços</h2>
<div class="service-grid">
<div class="service-card"><i class="fa-solid fa-couch"></i><br><b>Sofá</b><br><span class="price">R$120</span></div>
<div class="service-card"><i class="fa-solid fa-bed"></i><br><b>Colchão</b><br><span class="price">R$100</span></div>
<div class="service-card"><i class="fa-solid fa-car"></i><br><b>Automotivo</b><br><span class="price">R$150</span></div>
<div class="service-card"><i class="fa-solid fa-chair"></i><br><b>Poltrona</b><br><span class="price">R$70</span></div>
</div>
</div>

<div class="card">
<h2>Agendar - Tudo em 1 Página</h2>
<div class="notice"><i class="fa-solid fa-circle-info"></i><span>Limite de 4/dia. Foto convertida em Base64 automaticamente.</span></div>
<form id="form">
<div class="form-group"><label>Nome</label><input id="nome" required></div>
<div class="form-group"><label>WhatsApp</label><input id="tel" required placeholder="(61) 9...."></div>
<div class="form-group"><label>Serviço</label><select id="serv" required><option value="">Selecione</option><option>Sofá</option><option>Colchão</option><option>Automotivo</option><option>Poltronas</option></select></div>
<div class="form-group"><label>Tecido</label><select id="tecido" required><option value="">Selecione</option><option>Suede</option><option>Linho</option><option>Corino</option><option>Automotivo</option><option>Outro</option></select></div>
<div class="form-group"><label>Foto (vai virar Base64)</label><input type="file" id="foto" accept="image/*" capture="environment">
<img id="preview">
<button type="button" id="btnCopy" class="btn btn-blue"><i class="fa-solid fa-copy"></i> Copiar Base64</button>
<textarea id="base64Output" readonly placeholder="O código Base64 vai aparecer aqui..."></textarea>
<span id="size" style="font-size:.75rem;color:#666"></span>
</div>
<div class="form-group"><label>Data</label><input type="date" id="data" required></div>
<div class="form-group"><label>Horário</label><select id="hora" required><option value="">Escolha a data primeiro</option><option>08:00</option><option>10:00</option><option>12:00</option><option>14:00</option><option>16:00</option></select></div>
<button type="submit" id="btn" class="btn btn-green"><i class="fa-brands fa-whatsapp"></i> Enviar para WhatsApp</button>
</form>
</div>
</div>

<a class="whatsapp" href="https://wa.me/5561986791580">WhatsApp</a>

<script>
const WHATS = "5561986791580";
document.getElementById('data').min = new Date().toISOString().split('T')[0];
let base64Final = "";

// Bloqueio horário - tudo no localStorage
document.getElementById('data').addEventListener('change', function(){
  const d=this.value; const sel=document.getElementById('hora');
  const list=JSON.parse(localStorage.getItem('mf_agend')||'[]');
  [...sel.options].forEach(o=>{ if(o.value){o.disabled=false; o.textContent=o.value} });
  if(!d) return;
  list.forEach(i=>{ if(i.data===d){ [...sel.options].forEach(o=>{ if(o.value===i.hora){o.disabled=true; o.textContent=o.value+" (Indisponível)"} }) } });
});

// Foto -> Base64 comprimida
document.getElementById('foto').addEventListener('change', function(){
  const file=this.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); const MAX=800; let w=img.width,h=img.height;
      if(w>MAX){h*=MAX/w; w=MAX} c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      base64Final=c.toDataURL('image/jpeg',0.6);
      document.getElementById('preview').src=base64Final; document.getElementById('preview').style.display='block';
      document.getElementById('base64Output').style.display='block'; document.getElementById('base64Output').value=base64Final;
      document.getElementById('btnCopy').style.display='flex';
      document.getElementById('size').textContent = Math.round(base64Final.length/1024)+" KB - Base64 pronta!";
      localStorage.setItem('ultima_base64', base64Final);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
});

// Copiar
document.getElementById('btnCopy').addEventListener('click', async()=>{
  await navigator.clipboard.writeText(base64Final);
  const b=document.getElementById('btnCopy'); b.innerHTML='✅ Copiado!'; setTimeout(()=>b.innerHTML='<i class="fa-solid fa-copy"></i> Copiar Base64',2000);
});

// Enviar
document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault();
  const nome=document.getElementById('nome').value;
  const tel=document.getElementById('tel').value;
  const serv=document.getElementById('serv').value;
  const tecido=document.getElementById('tecido').value;
  const dataB=document.getElementById('data').value;
  const hora=document.getElementById('hora').value;
  const [a,m,d]=dataB.split('-'); const dataF=`${d}/${m}/${a}`;

  const list=JSON.parse(localStorage.getItem('mf_agend')||'[]');
  list.push({data:dataB,hora,nome,serv,tecido,base64:base64Final.substring(0,200)+'...'});
  localStorage.setItem('mf_agend', JSON.stringify(list));

  const texto=`Olá MF! Quero agendar:%0A%0A👤 ${encodeURIComponent(nome)}%0A📱 ${encodeURIComponent(tel)}%0A🧽 ${encodeURIComponent(serv)} (${encodeURIComponent(tecido)})%0A📅 ${encodeURIComponent(dataF)} às ${encodeURIComponent(hora)}%0A%0A📷 Foto: ${base64Final?'Enviei a base64, vou mandar a imagem aqui':'(sem foto)'}%0A💳 Pix sinal?`;
  window.location.href=`https://wa.me/${WHATS}?text=${texto}`;
});
</script>
</body>
</html>
